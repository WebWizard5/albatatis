<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu | Al Batatis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Pacifico&family=Lalezar&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/2.44.0/iconfont/tabler-icons.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  :root{
    --purple-900:#26071f; --purple-800:#3a0e30; --purple-700:#4a1440;
    --maroon:#6f1c3c; --gold:#f7b311; --gold-2:#ffcb3d; --gold-dark:#c98900;
    --cream:#fff6df; --cream-2:#fffaf0; --ink:#2c0a30; --basil:#22b04b; --danger:#e33b3b;
    --radius:18px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Poppins',sans-serif; color:var(--ink); background:var(--purple-900); display:flex; justify-content:center;}
  a{color:inherit; text-decoration:none;}
  button{font-family:inherit; cursor:pointer; border:none; background:none;}
  ::selection{background:var(--gold); color:var(--purple-900);}

  .shell{width:100%; max-width:480px; min-height:100vh; background:#f7ae12; position:relative; padding-bottom:90px;}

  /* ---------------- header ---------------- */
  header{
    background:linear-gradient(160deg, var(--purple-800), var(--purple-900));
    padding:16px 20px 46px; position:relative; text-align:center; overflow:hidden;
  }
  header::after{
    content:""; position:absolute; left:0; right:0; bottom:-1px; height:36px; background:#f7ae12;
    border-radius:50% 50% 0 0/100% 100% 0 0;
  }
  .back-btn{
    position:absolute; top:16px; left:16px; z-index:3;
    width:38px; height:38px; border-radius:50%; background:var(--gold); color:var(--purple-800);
    display:flex; align-items:center; justify-content:center;
  }
  .back-btn svg{width:18px; height:18px;}
  .hours-badge{
    position:absolute; top:16px; right:16px; z-index:3;
    display:inline-flex; align-items:center; gap:6px; padding:5px 11px 5px 9px; border-radius:999px;
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.6px; border:1px solid transparent;
  }
  .hours-badge .dot{width:7px; height:7px; border-radius:50%;}
  .hours-badge.is-open{background:rgba(34,176,75,.18); color:#7CE29B; border-color:rgba(34,176,75,.4);}
  .hours-badge.is-open .dot{background:#22b04b;}
  .hours-badge.is-closed{background:rgba(227,59,59,.18); color:#ff9b9b; border-color:rgba(227,59,59,.4);}
  .hours-badge.is-closed .dot{background:#e33b3b;}

  .mini-logo{font-family:'Lalezar',sans-serif; color:var(--gold); font-size:22px; margin-top:6px;}
  .menu-title{font-family:'Baloo 2',sans-serif; font-weight:800; font-size:38px; color:#fff; letter-spacing:1px; position:relative; display:inline-block; margin-top:4px;}
  .menu-title .tick{color:var(--gold); font-weight:400; font-size:26px; margin:0 8px; vertical-align:2px;}
  .menu-sub{font-family:'Pacifico',cursive; color:var(--gold-2); font-size:16px; margin-top:2px;}

  /* ---------------- filters ---------------- */
  .filters-wrap{position:relative; z-index:2; margin:-24px 16px 0; }
  .search-box{
    background:var(--cream-2); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:10px;
    box-shadow:0 10px 22px -10px rgba(0,0,0,.35);
  }
  .search-box i{color:var(--purple-800); font-size:17px;}
  .search-box input{flex:1; border:none; outline:none; background:transparent; font-family:inherit; font-size:13.5px; color:var(--ink);}
  .search-box input::placeholder{color:#8a7a63;}

  .chip-row{display:flex; gap:8px; overflow-x:auto; padding:14px 16px 4px; scrollbar-width:none;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    flex-shrink:0; background:var(--cream-2); color:var(--purple-800); font-weight:600; font-size:12.5px;
    padding:9px 16px; border-radius:999px; border:1.5px solid transparent; white-space:nowrap; transition:.15s;
  }
  .chip.active{background:var(--purple-800); color:var(--gold-2); border-color:var(--purple-800);}

  /* ---------------- items ---------------- */
  .items{padding:8px 16px 10px; display:flex; flex-direction:column; gap:14px;}
  .section-label{font-family:'Baloo 2',sans-serif; font-weight:700; font-size:15px; color:var(--purple-800); margin:10px 2px 0;}

  .item-card{
    background:var(--cream-2); border-radius:var(--radius); padding:12px; display:flex; align-items:center; gap:14px;
    box-shadow:0 8px 18px -10px rgba(0,0,0,.3); position:relative; transition:transform .12s ease;
  }
  .item-card.reverse{flex-direction:row-reverse; text-align:right;}
  .item-card.is-soldout{opacity:.55;}

  /* -------- item image / placeholder -------- */
  .item-thumb{
    width:112px; height:112px; border-radius:16px; flex-shrink:0; overflow:hidden; position:relative;
  }
  .item-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
  .item-thumb.placeholder{
    background:repeating-linear-gradient(45deg, #fff3d6, #fff3d6 9px, #ffe9b8 9px, #ffe9b8 18px);
    border:2px dashed var(--gold-dark); display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:5px; color:var(--gold-dark);
  }
  .item-thumb.placeholder svg{width:26px; height:26px; opacity:.85;}
  .item-thumb.placeholder span{font-size:9px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; opacity:.85;}

  .item-body{flex:1; min-width:0;}
  .item-body h3{font-family:'Baloo 2',sans-serif; font-size:18px; font-weight:700; color:var(--purple-800); letter-spacing:.2px; line-height:1.25;}
  .item-body p{font-size:12.5px; color:#7a6a55; line-height:1.55; margin-top:4px; font-weight:500;}
  .item-foot{display:flex; align-items:center; gap:10px; margin-top:9px;}
  .item-card.reverse .item-foot{flex-direction:row-reverse;}
  .price-pill{background:var(--purple-800); color:var(--gold-2); font-weight:700; font-size:13px; padding:7px 13px; border-radius:999px; font-family:'Baloo 2',sans-serif;}
  .add-btn{
    background:var(--gold); color:var(--purple-800); font-weight:700; font-size:12.5px; padding:7px 15px; border-radius:999px;
    display:flex; align-items:center; gap:5px; transition:.15s;
  }
  .add-btn svg{width:13px; height:13px;}
  .add-btn.added-flash{background:var(--basil); color:#fff;}
  .badge-soldout{position:absolute; top:8px; right:8px; background:var(--purple-800); color:#fff; font-size:9px; font-weight:700; text-transform:uppercase; padding:4px 9px; border-radius:999px;}
  .item-card.is-soldout .add-btn{pointer-events:none; opacity:.6;}
  .no-results{text-align:center; color:var(--purple-800); font-weight:600; padding:30px 10px; opacity:.7;}

  /* ---------------- floating buttons ---------------- */
  .fab-wa{position:fixed; right:18px; bottom:18px; z-index:60; width:54px; height:54px; border-radius:50%;
    background:#22b04b; color:#fff; display:flex; align-items:center; justify-content:center;
    box-shadow:0 10px 22px -6px rgba(34,176,75,.7);}
  .fab-wa svg{width:27px; height:27px;}
  .fab-cart{position:fixed; right:18px; bottom:80px; z-index:60; width:48px; height:48px; border-radius:50%;
    background:var(--purple-800); color:var(--gold-2); border:1px solid var(--gold-dark); display:flex; align-items:center; justify-content:center; position:fixed;
    box-shadow:0 10px 22px -6px rgba(0,0,0,.5);}
  .fab-cart svg{width:21px; height:21px;}
  .cart-badge{position:absolute; top:-4px; right:-4px; min-width:19px; height:19px; padding:0 4px; border-radius:999px;
    background:var(--danger); color:#fff; font-size:10.5px; font-weight:700; display:none; align-items:center; justify-content:center;}
  .fab-cart.bump{animation:bump .3s ease;}
  @keyframes bump{0%,100%{transform:scale(1);}50%{transform:scale(1.18);}}

  .this-mx{max-width:480px; margin:0 auto;}
  @media (min-width:481px){ .fab-wa,.fab-cart{ right:calc(50% - 240px + 18px); } }

  /* ---------------- drawer / modal ---------------- */
  .overlay{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:80; display:none; align-items:flex-end; justify-content:center;}
  .overlay.open{display:flex;}
  .overlay.center{align-items:center; padding:16px;}
  .sheet{
    width:100%; max-width:480px; background:var(--cream-2); border-radius:22px 22px 0 0; max-height:88vh;
    display:flex; flex-direction:column; overflow:hidden;
  }
  .sheet-head{padding:16px 18px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #eee2c9; background:var(--cream-2);}
  .sheet-head h3{font-family:'Baloo 2',sans-serif; color:var(--purple-800); font-size:18px;}
  .sheet-head button{font-size:22px; color:var(--purple-800);}
  .sheet-body{padding:16px 18px; overflow-y:auto;}

  .cart-row{display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px dashed #e5d7b8;}
  .cart-row .cn{flex:1; font-size:13px; font-weight:600; color:var(--ink);}
  .cart-row .cp{font-size:12px; color:#7a6a55; margin-top:2px;}
  .qty-ctrl{display:flex; align-items:center; gap:8px;}
  .qty-ctrl button{width:26px; height:26px; border-radius:8px; background:var(--purple-800); color:var(--gold-2); font-weight:700; font-size:15px;}
  .qty-ctrl span{width:18px; text-align:center; font-weight:700; font-size:13px;}
  .cart-empty{text-align:center; color:#8a7a63; padding:26px 10px; font-size:13px;}

  .od-label{font-size:11px; text-transform:uppercase; letter-spacing:1.2px; color:var(--gold-dark); font-weight:700; margin:14px 0 8px;}
  .od-field{margin-bottom:10px;}
  .od-field input, .od-field textarea{
    width:100%; background:#f3e8cf; border:1.5px solid transparent; border-radius:10px; padding:11px 12px; font-size:13px;
    font-family:inherit; outline:none; color:var(--ink);
  }
  .od-field input:focus, .od-field textarea:focus{border-color:var(--gold-dark);}
  .od-field textarea{resize:vertical; min-height:54px;}

  .totals{border-top:1px solid #eee2c9; margin-top:14px; padding-top:10px;}
  .t-row{display:flex; justify-content:space-between; font-size:13px; color:#6b5a49; padding:3px 0;}
  .t-row.grand{font-weight:800; color:var(--purple-800); font-size:16px; margin-top:4px; font-family:'Baloo 2',sans-serif;}
  .delivery-note{font-size:11.5px; color:var(--gold-dark); background:#fff3d6; border:1px dashed var(--gold-dark); border-radius:10px; padding:8px 10px; margin:8px 0; line-height:1.45;}

  .place-btn{
    width:100%; margin-top:14px; background:#22b04b; color:#fff; font-weight:700; font-size:14.5px; padding:14px;
    border-radius:14px; display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .place-btn i{font-size:18px;}

  .bill-box{background:#fdf8f1; border-radius:14px; padding:16px; color:#2c0a30; text-align:left; font-size:12.5px;}
  .bill-modal-actions{display:flex; gap:10px; margin-top:14px;}
  .bill-modal-actions button{flex:1; padding:12px; border-radius:10px; font-weight:700; font-size:12px; text-transform:uppercase;}
  .bmc-save{background:var(--gold); color:var(--purple-800);}
  .bmc-share{background:#22b04b; color:#fff;}
  .bmc-close{background:#eee2c9; color:var(--purple-800);}

  .alert-box{background:var(--cream-2); border-radius:16px; padding:22px; max-width:320px; width:100%; text-align:center;}
  .alert-box p{font-size:13.5px; color:var(--ink); margin-bottom:16px; line-height:1.5;}
  .alert-box button{background:var(--purple-800); color:var(--gold-2); font-weight:700; padding:10px 22px; border-radius:10px; font-size:12.5px;}

  /* ---------------- item size tags + options popup ---------------- */
  .size-tags{display:flex; flex-wrap:wrap; gap:6px;}
  .price-pill.small{font-size:11px; padding:5px 10px;}
  .opt-group{margin-bottom:16px;}
  .opt-group-label{font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--gold-dark); font-weight:700; margin-bottom:8px;}
  .opt-row{
    display:flex; align-items:center; justify-content:space-between; background:#f3e8cf; border-radius:10px;
    padding:11px 13px; margin-bottom:8px; border:1.5px solid transparent; transition:.12s;
  }
  .opt-row.selected{border-color:var(--purple-800); background:#fff3d6;}
  .opt-row .oname{font-size:13px; font-weight:600; color:var(--ink);}
  .opt-row .oprice{font-size:12.5px; font-weight:700; color:var(--purple-800);}
</style>
</head>
<body>

<div class="shell">
  <header>
    <a class="back-btn" href="index.html" aria-label="Back">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
    </a>
    <span class="hours-badge" id="hoursBadge"><span class="dot"></span><span id="hoursText">&hellip;</span></span>
    <div class="mini-logo">البطاطس</div>
    <div class="menu-title"><span class="tick">&lsaquo;</span>MENU<span class="tick">&rsaquo;</span></div>
    <div class="menu-sub">Deliciously Yours!</div>
  </header>

  <div class="filters-wrap">
    <div class="search-box">
      <i class="ti ti-search"></i>
      <input type="text" id="searchInput" placeholder="Search the menu..." oninput="renderItems()">
    </div>
  </div>

  <div class="chip-row" id="chipRow"></div>

  <div class="items" id="itemsWrap"></div>
</div>

<a class="fab-wa" href="https://wa.me/923135959464" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor">
    <path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.29-1.38a9.9 9.9 0 0 0 4.7 1.19h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.03c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.11.11-1.79-.11-.41-.13-.94-.3-1.62-.6-2.86-1.24-4.72-4.15-4.87-4.34-.14-.19-1.17-1.55-1.17-2.96 0-1.4.73-2.09 1-2.38.24-.26.53-.33.71-.33.18 0 .35 0 .5.01.16.01.38-.06.6.46.24.57.8 1.98.87 2.12.07.14.11.31.02.5-.09.19-.14.31-.27.47-.14.16-.29.36-.41.48-.14.14-.28.29-.12.57.16.28.71 1.17 1.53 1.9 1.05.94 1.94 1.23 2.22 1.37.28.14.44.12.6-.07.16-.19.68-.79.87-1.06.18-.28.36-.23.6-.14.24.09 1.55.73 1.82.87.27.14.44.21.51.32.07.12.07.68-.17 1.36z"/>
  </svg>
</a>
<button class="fab-cart" id="cartFab" onclick="openCart()" aria-label="Open cart">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path>
    <path d="M3 6h18"></path>
    <path d="M16 10a4 4 0 0 1-8 0"></path>
  </svg>
  <span class="cart-badge" id="cartBadge">0</span>
</button>

<!-- cart / order sheet -->
<div class="overlay" id="cartOverlay">
  <div class="sheet">
    <div class="sheet-head">
      <h3>Your Order</h3>
      <button onclick="closeCart()">&times;</button>
    </div>
    <div class="sheet-body">
      <div id="cartList"></div>

      <div class="od-field" style="margin-top:12px;">
        <input type="text" id="custName" placeholder="Your name">
      </div>
      <div class="od-field">
        <input type="tel" id="custPhone" placeholder="Phone number">
      </div>
      <div class="od-field" id="addressField">
        <input type="text" id="custAddress" placeholder="Delivery address">
      </div>
      <div class="od-field">
        <textarea id="custNote" placeholder="Any instructions? (optional)"></textarea>
      </div>

      <div class="totals">
        <div class="t-row"><span>Subtotal</span><span id="tSub">Rs. 0</span></div>
        <div class="delivery-note" id="deliveryNote"></div>
        <div class="t-row grand"><span>Total</span><span id="tGrand">Rs. 0</span></div>
      </div>

      <button class="place-btn" onclick="placeOrder()"><i class="ti ti-brand-whatsapp"></i> Place Order on WhatsApp</button>
    </div>
  </div>
</div>

<!-- bill preview -->
<div class="overlay center" id="billOverlay">
  <div class="sheet" style="border-radius:20px; max-height:90vh;">
    <div class="sheet-head"><h3>Order Summary</h3><button onclick="closeBillPreview()">&times;</button></div>
    <div class="sheet-body">
      <div class="bill-box" id="billBox"></div>
      <div class="bill-modal-actions">
        <button class="bmc-save" onclick="downloadBill()"><i class="ti ti-download"></i> Download Bill</button>
        <button class="bmc-share" onclick="confirmOrder()"><i class="ti ti-brand-whatsapp"></i> Confirm Order</button>
      </div>
    </div>
  </div>
</div>

<!-- size / flavour options popup -->
<div class="overlay center" id="optionsOverlay">
  <div class="sheet" style="border-radius:20px; max-height:90vh;">
    <div class="sheet-head"><h3 id="optTitle">Choose Options</h3><button onclick="closeOptions()">&times;</button></div>
    <div class="sheet-body">
      <div id="optSizes"></div>
      <div id="optFlavours"></div>
      <button class="place-btn" style="background:var(--gold); color:var(--purple-800);" onclick="confirmAddFromOptions()"><i class="ti ti-plus"></i> Add to Cart</button>
    </div>
  </div>
</div>

<!-- alert -->
<div class="overlay center" id="alertOverlay">
  <div class="alert-box">
    <p id="alertMsg"></p>
    <button onclick="hideAlert()">Got it</button>
  </div>
</div>

<script>
/* ============ SETTINGS — edit these when info is finalised ============ */
const WHATSAPP_NUMBER = "923135959464";   // Al Batatis order number
const DELIVERY_NOTE = "Delivery charges will be confirmed by us based on your location.";
const DELIVERY_AREA = "Chakwal";
const BUSINESS_HOURS = { open:"12:00", close:"23:59" }; // 24h format

/* ============ MENU DATA ============
   To add/remove items or mark something sold out, edit this list.
   Add  soldOut:true  to any item to show a "Sold Out" ribbon.
   Add  img:"images/your-photo.png"  to any item once you have a real
   photo ready — until then it shows a placeholder box so you know
   exactly where to drop it in. */
const MENU = [
  { id:"fries", name:"Fries", items:[
    {name:"Simple Fries", desc:"Crispy, golden fries cone — quick & delicious.", price:100, img:"images/conefries.png"},
    {name:"Fries Cup", desc:"Loaded cup of crispy fries — pick your favourite flavour.", sizes:[{label:"Regular",price:150},{label:"Large",price:200}], flavours:["Dynamite","Fusion","Mayo"], img:"images/friescup.png"},
    {name:"Chicken Fries", desc:"Crispy fries topped with juicy chicken & special sauce.", sizes:[{label:"Regular",price:250},{label:"Large",price:300}], img:"images/chickenfries.png"},
    {name:"Pizza Fries", desc:"Fries loaded with chicken, cheese & pizza-style toppings.", sizes:[{label:"Small",price:500},{label:"Large",price:700}], img:"images/pizzafries.png"},
  ]},
  { id:"mains", name:"Burgers & Wraps", items:[
    {name:"Zinger", desc:"Spicy zinger fillet with fries & our special sauce.", price:330, img:"images/zingerburger.png"},
    {name:"Shawarma", desc:"Delicious shawarma served with fries & sauce.", price:150, img:"images/shawrma.png"},
  ]},
  { id:"wings", name:"Wings", items:[
    {name:"Hot Wings", desc:"Spicy, juicy & perfectly cooked hot wings.", sizes:[{label:"6 pcs",price:350},{label:"12 pcs",price:700}], img:"images/hotwings.png"},
    {name:"BBQ Sauce Wings", desc:"Saucy BBQ-glazed wings, 6 pcs per order.", price:400, img:"images/BBQ sause wing.png"},
  ]},
];
const ALL_ITEMS = MENU.flatMap(c => c.items.map(it => ({...it, catId:c.id, catName:c.name})));

let activeCat = "all";
let cart = []; // {name, price, qty}
let orderType = "Delivery"; // only delivery is offered now
let currentRenderList = []; // items currently shown, indexed for the options popup
let optItem = null, optSelectedSize = null, optSelectedFlavour = null;

const PLACEHOLDER_ICON = `
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="2"></rect>
    <circle cx="8.5" cy="10" r="1.5"></circle>
    <path d="M21 15l-5-5-4 4-2-2-5 5"></path>
  </svg>`;

/* ---------- chips ---------- */
function renderChips(){
  const row = document.getElementById('chipRow');
  const cats = [{id:"all", name:"All"}, ...MENU.map(c => ({id:c.id, name:c.name}))];
  row.innerHTML = cats.map(c => `<button class="chip ${c.id===activeCat?'active':''}" onclick="setCat('${c.id}')">${c.name}</button>`).join('');
}
function setCat(id){ activeCat = id; renderChips(); renderItems(); }

/* ---------- items ---------- */
function renderItems(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const wrap = document.getElementById('itemsWrap');
  let list = ALL_ITEMS.filter(it => activeCat==="all" || it.catId===activeCat);
  if(q) list = list.filter(it => it.name.toLowerCase().includes(q) || it.desc.toLowerCase().includes(q));

  if(!list.length){ wrap.innerHTML = '<div class="no-results">No items found. Try a different search.</div>'; return; }

  currentRenderList = list;

  wrap.innerHTML = list.map((it, i) => `
    <div class="item-card ${i%2? 'reverse':''} ${it.soldOut?'is-soldout':''}">
      ${it.soldOut ? '<span class="badge-soldout">Sold Out</span>' : ''}
      <div class="item-thumb ${it.img ? '' : 'placeholder'}">
        ${it.img ? `<img src="${it.img}" alt="${it.name}">` : `${PLACEHOLDER_ICON}<span>Add photo</span>`}
      </div>
      <div class="item-body">
        <h3>${it.name}</h3>
        <p>${it.desc}</p>
        <div class="item-foot">
          ${it.sizes
            ? `<div class="size-tags">${it.sizes.map(s => `<span class="price-pill small">${s.label} Rs. ${s.price}</span>`).join('')}</div>`
            : `<span class="price-pill">Rs. ${it.price}</span>`}
          <button class="add-btn" ${it.soldOut?'disabled':''} onclick="handleAdd(${i}, this)"><i class="ti ti-plus"></i> Add</button>
        </div>
      </div>
    </div>
  `).join('');
}
function escapeQ(s){ return s.replace(/'/g,"\\'"); }

/* ---------- add button: goes straight to cart, or opens the size/flavour popup ---------- */
function handleAdd(i, btn){
  const it = currentRenderList[i];
  if(it.sizes || it.flavours){ openOptions(i); }
  else{ addToCart(it.name, it.price, btn); }
}

/* ---------- size / flavour options popup ---------- */
function openOptions(i){
  optItem = currentRenderList[i];
  optSelectedSize = optItem.sizes ? 0 : null;
  optSelectedFlavour = optItem.flavours ? 0 : null;
  document.getElementById('optTitle').textContent = optItem.name;
  renderOptionGroups();
  document.getElementById('optionsOverlay').classList.add('open');
}
function closeOptions(){ document.getElementById('optionsOverlay').classList.remove('open'); optItem = null; }
function renderOptionGroups(){
  document.getElementById('optSizes').innerHTML = optItem.sizes ? `
    <div class="opt-group">
      <div class="opt-group-label">Choose Size</div>
      ${optItem.sizes.map((s,idx) => `
        <div class="opt-row ${optSelectedSize===idx?'selected':''}" onclick="selectSize(${idx})">
          <span class="oname">${s.label}</span><span class="oprice">Rs. ${s.price}</span>
        </div>`).join('')}
    </div>` : '';
  document.getElementById('optFlavours').innerHTML = optItem.flavours ? `
    <div class="opt-group">
      <div class="opt-group-label">Choose Flavour</div>
      ${optItem.flavours.map((f,idx) => `
        <div class="opt-row ${optSelectedFlavour===idx?'selected':''}" onclick="selectFlavour(${idx})">
          <span class="oname">${f}</span>
        </div>`).join('')}
    </div>` : '';
}
function selectSize(idx){ optSelectedSize = idx; renderOptionGroups(); }
function selectFlavour(idx){ optSelectedFlavour = idx; renderOptionGroups(); }
function confirmAddFromOptions(){
  if(!optItem) return;
  let name = optItem.name;
  let price = optItem.price || 0;
  if(optItem.sizes){
    const s = optItem.sizes[optSelectedSize];
    name += ` (${s.label})`;
    price = s.price;
  }
  if(optItem.flavours){
    name += ` - ${optItem.flavours[optSelectedFlavour]}`;
  }
  addToCart(name, price, null);
  closeOptions();
}

/* ---------- cart ---------- */
function addToCart(name, price, btn){
  const existing = cart.find(c => c.name===name);
  if(existing) existing.qty++;
  else cart.push({name, price, qty:1});
  updateCartBadge();
  if(btn){
    btn.classList.add('added-flash');
    btn.innerHTML = '<i class="ti ti-check"></i> Added';
    setTimeout(() => { btn.classList.remove('added-flash'); btn.innerHTML = '<i class="ti ti-plus"></i> Add'; }, 900);
  }
  const fab = document.getElementById('cartFab');
  fab.classList.remove('bump'); void fab.offsetWidth; fab.classList.add('bump');
}
function changeQty(name, delta){
  const row = cart.find(c => c.name===name);
  if(!row) return;
  row.qty += delta;
  if(row.qty<=0) cart = cart.filter(c => c.name!==name);
  updateCartBadge(); renderCartList();
}
function updateCartBadge(){
  const count = cart.reduce((s,c)=>s+c.qty,0);
  const badge = document.getElementById('cartBadge');
  badge.textContent = count;
  badge.style.display = count>0 ? 'flex' : 'none';
}
function cartSubtotal(){ return cart.reduce((s,c)=>s+c.price*c.qty,0); }

function renderCartList(){
  const el = document.getElementById('cartList');
  if(!cart.length){ el.innerHTML = '<div class="cart-empty">Your cart is empty. Add something tasty!</div>'; }
  else{
    el.innerHTML = cart.map(c => `
      <div class="cart-row">
        <div><div class="cn">${c.name}</div><div class="cp">Rs. ${c.price} each</div></div>
        <div class="qty-ctrl">
          <button onclick="changeQty('${escapeQ(c.name)}', -1)">&minus;</button>
          <span>${c.qty}</span>
          <button onclick="changeQty('${escapeQ(c.name)}', 1)">+</button>
        </div>
      </div>`).join('');
  }
  const sub = cartSubtotal();
  document.getElementById('tSub').textContent = 'Rs. ' + sub;
  document.getElementById('deliveryNote').innerHTML = '<i class="ti ti-info-circle"></i> ' + DELIVERY_NOTE;
  document.getElementById('tGrand').textContent = 'Rs. ' + sub;
}

function openCart(){ renderCartList(); document.getElementById('cartOverlay').classList.add('open'); }
function closeCart(){ document.getElementById('cartOverlay').classList.remove('open'); }

/* ---------- place order ---------- */
let pendingOrder = null; // holds order details until user confirms from the summary popup

function placeOrder(){
  if(!cart.length){ showAlert('Please add at least one item to your cart first.'); return; }
  const name = document.getElementById('custName').value.trim();
  const phone = document.getElementById('custPhone').value.trim();
  const address = document.getElementById('custAddress').value.trim();
  const note = document.getElementById('custNote').value.trim();

  if(!name || !phone){ showAlert('Please enter your name and phone number.'); return; }
  if(!address){ showAlert('Please enter your delivery address.'); return; }

  const sub = cartSubtotal();
  const grand = sub;

  // Don't go to WhatsApp yet — show the summary popup first so the user can
  // review, download the bill, and only then confirm.
  pendingOrder = {
    name, phone, address, note, orderType, sub, grand,
    items: cart.map(c => ({...c}))
  };
  showBill(pendingOrder);
}

/* Called from the "Confirm Order" button inside the summary popup —
   this is the only place that actually opens WhatsApp. */
function confirmOrder(){
  if(!pendingOrder){ return; }
  const o = pendingOrder;

  let msg = `*New Order — Al Batatis*\n\n`;
  msg += `*Type:* ${o.orderType}\n*Name:* ${o.name}\n*Phone:* ${o.phone}\n`;
  msg += `*Address:* ${o.address}\n`;
  msg += `\n*Items:*\n`;
  o.items.forEach(c => { msg += `- ${c.name} x${c.qty} = Rs. ${c.price*c.qty}\n`; });
  msg += `\n*Subtotal:* Rs. ${o.sub}\n`;
  msg += `*Total (excl. delivery):* Rs. ${o.grand}\n`;
  msg += `_Delivery charges will be confirmed based on your location._\n`;
  if(o.note) msg += `\n*Note:* ${o.note}\n`;

  window.open('https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg), '_blank');

  // Order sent — now it's safe to close the popup and clear the cart.
  document.getElementById('billOverlay').classList.remove('open');
  cart = [];
  pendingOrder = null;
  updateCartBadge();
}

/* ---------- bill preview ---------- */
let lastBillText = '';
function showBill(o){
  const box = document.getElementById('billBox');
  let rows = cart.map(c => `<div style="display:flex;justify-content:space-between;padding:4px 0;"><span>${c.name} x${c.qty}</span><span>Rs. ${c.price*c.qty}</span></div>`).join('');
  box.innerHTML = `
    <div style="text-align:center;margin-bottom:10px;">
      <div style="font-family:'Lalezar',sans-serif;color:#3a0e30;font-size:22px;">البطاطس</div>
      <div style="font-size:11px;color:#8a7a63;">Al Batatis — Best Fries In Town</div>
    </div>
    <div style="border-top:1px dashed #ccc;border-bottom:1px dashed #ccc;padding:8px 0;margin:8px 0;">
      <div><b>${o.orderType}</b> &middot; ${o.name} &middot; ${o.phone}</div>
      ${o.address ? `<div style="font-size:11.5px;color:#7a6a55;margin-top:2px;">${o.address}</div>` : ''}
    </div>
    ${rows}
    <div style="border-top:1px dashed #ccc;margin-top:8px;padding-top:8px;">
      <div style="display:flex;justify-content:space-between;"><span>Subtotal</span><span>Rs. ${o.sub}</span></div>
      <div style="display:flex;justify-content:space-between;font-weight:800;color:#3a0e30;font-size:15px;margin-top:4px;"><span>Total</span><span>Rs. ${o.grand}</span></div>
    </div>
    <div style="margin-top:8px;font-size:11px;color:#c98900;">${DELIVERY_NOTE}</div>
    ${o.note ? `<div style="margin-top:8px;font-size:11.5px;color:#7a6a55;">Note: ${o.note}</div>` : ''}
    <div style="text-align:center;margin-top:12px;font-size:11px;color:#8a7a63;">Thank you for ordering from Al Batatis! 🍟</div>
  `;
  lastBillText = box.innerText;
  closeCart();
  document.getElementById('billOverlay').classList.add('open');
}
/* Closing the summary popup with the X (before confirming) should just
   close it and let the user go back and edit — the cart stays intact. */
function closeBillPreview(){ document.getElementById('billOverlay').classList.remove('open'); }

/* Downloads the order summary as a shareable image, e.g. to send/save. */
function downloadBill(){
  const box = document.getElementById('billBox');
  if(typeof html2canvas === 'undefined'){
    showAlert("Download isn't available right now — please check your internet connection and try again.");
    return;
  }
  html2canvas(box, {backgroundColor:'#fdf8f1', scale:2}).then(canvas => {
    const link = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,19).replace(/[:T]/g,'-');
    link.download = `AlBatatis-Bill-${stamp}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }).catch(() => {
    showAlert("Sorry, the bill couldn't be downloaded. Please try again.");
  });
}

/* ---------- alert modal ---------- */
function showAlert(msg){ document.getElementById('alertMsg').textContent = msg; document.getElementById('alertOverlay').classList.add('open'); }
function hideAlert(){ document.getElementById('alertOverlay').classList.remove('open'); }

/* ---------- business hours ---------- */
function isOpenNow(){
  const now = new Date();
  const [oH,oM] = BUSINESS_HOURS.open.split(':').map(Number);
  const [cH,cM] = BUSINESS_HOURS.close.split(':').map(Number);
  const openMins = oH*60+oM, closeMins = cH*60+cM, nowMins = now.getHours()*60+now.getMinutes();
  if(closeMins<=openMins) return nowMins>=openMins || nowMins<closeMins;
  return nowMins>=openMins && nowMins<closeMins;
}
function updateHoursBadge(){
  const badge = document.getElementById('hoursBadge');
  const open = isOpenNow();
  badge.classList.toggle('is-open', open);
  badge.classList.toggle('is-closed', !open);
  document.getElementById('hoursText').textContent = open ? 'Open now' : 'Closed';
}

/* ---------- init ---------- */
renderChips();
renderItems();
updateCartBadge();
updateHoursBadge();
setInterval(updateHoursBadge, 60000);
</script>
<script>
  /* Back button se page wapas aane par (bfcache restore) scroll/layout
     kabhi kabhi freeze ho jata hai — ye script us hisse ko force-refresh
     (reflow) kar deta hai taake scroll dobara chalne lage. */
  window.addEventListener('pageshow', function (event) {
    if (event.persisted) {
      document.body.style.display = 'none';
      void document.body.offsetHeight; /* reflow trigger */
      document.body.style.display = '';
    }
  });
</script>
